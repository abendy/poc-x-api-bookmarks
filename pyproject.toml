[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-api-bookmarks"
version = "0.1.0"
authors = [{ name = "Allan Bendy", email = "allan.bendy@gmail.com" }]
description = "X API bookmark management with OAuth 2.0 PKCE authentication"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "factory-boy",
    "ipdb",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pyright",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = []
only-include = ["collector.py", "oauth2_pkce.py"]



[tool.pyright]
venvPath = "."
venv = ".venv"
autoImportCompletions = true
diagnosticMode = "workspace"

# Set Type Checking Mode
typeCheckingMode = "basic"

# Critical
reportMissingImports = "error"
reportUndefinedVariable = "error"
reportUnboundVariable = "error"
reportAttributeAccessIssue = "error"

# Useful warnings
reportGeneralTypeIssues = "warning"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportOptionalSubscript = "warning"
reportUnusedImport = "warning"

# Ignore unnecessary strictness
reportMissingTypeStubs = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedClassDecorator = "none"

[tool.mypy]
python_version = "3.9"
pretty = true                         # Enables pretty printing of error messages
# Critical
ignore_missing_imports = true       # Avoid unnecessary import errors
check_untyped_defs = true           # Type-checks functions even without type hints
warn_unreachable = true             # Detects dead code
disallow_incomplete_defs = false    # Disallow incomplete function definitions
no_implicit_optional = true         # Disallow implicit `None` handling
strict_equality = true              # Enables strict equality checks
# Useful warnings
disallow_untyped_defs = false       # Set to `true` if you want all functions typed
disallow_untyped_calls = false      # Disallows calling functions without type hints
disallow_untyped_decorators = false # Disallow untyped decorators
warn_unused_ignores = true          # Warns when a `# type: ignore` comment is unnecessary
warn_return_any = true              # Helps catch functions returning `Any`
warn_redundant_casts = true         # Warns when a cast is unnecessary
warn_no_return = false              # Warns when a function doesn't have a return type
warn_unused_configs = true          # Warns when a config is unused

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "ARG",  # unused arguments
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify (modern code patterns)
    "PTH",  # flake8-use-pathlib (pathlib over os.path)
    "D",    # docstring conventions
]
ignore = [
    "B904",   # Allow raising exceptions without from in some cases
    "D202",   # No blank lines allowed after function docstring
    "D203",   # Ignore one-blank-line-before-class to avoid conflict with D211
    "D212",   # Multi-line docstring summary should start at the first line
    "D401",   # Imperative mood required in docstring summary
    "D406",   # Section name should end with a newline
    "D407",   # Missing dashed underline after docstring sections
    "D413",   # Missing blank line after last section
    "FIX002", # Ignore TODO/FIXME
    "N802",   # Allow do_GET method name (required by BaseHTTPRequestHandler)
    "PTH107", # Allow os.remove for now (pathlib migration can be gradual)
    "PTH110", # Allow os.path.exists for now (pathlib migration can be gradual)
    "PTH123", # Allow os.path.dirname/basename for now (pathlib migration can be gradual)
    "RUF012", # Allow mutable class attributes without ClassVar for now
    "SIM108", # Allow if-else over ternary when more readable
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".uv_cache",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__ files
"tests/**/*" = ["ARG001"]  # Allow unused arguments in tests for fixtures

[tool.ruff.lint.isort]
known-first-party = ["x_api"]

[tool.ruff.lint.mccabe]
max-complexity = 15  # Increased from default 10 to allow for more complex functions

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = """
    --strict-markers
    --strict-config
    -ra
    -v
    --doctest-modules
    --cov=.
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:coverage_html
"""
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "slow: marks tests as slow running",
    "network: marks tests that require network access",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
